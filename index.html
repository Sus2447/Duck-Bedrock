<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ducksmp</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#1b1b1f;color:#fff;font-family:Arial,sans-serif}
.box{width:min(86vw,340px);aspect-ratio:1/1;background:#2a2a31;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;text-align:center}
h1{margin:0;font-size:28px}
p{margin:0;color:#bbb;font-size:15px}
code{background:#111;padding:2px 6px;border-radius:4px;color:#fff}
button{background:#4caf50;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:16px;cursor:pointer}
button:hover{background:#43a047}
#fail{display:none;flex-direction:column;align-items:center;gap:12px}
</style>
</head>
<body>
<div class="box">
<h1>Ducksmp</h1>
<p id="status">Abrindo o Minecraft...</p>
<div id="fail">
<p>Não deu certo. Adicione manualmente:<br><code>ducksmp.com.br</code> porta <code>25544</code></p>
<button onclick="tentar()">Tentar de novo</button>
</div>
</div>
<script>
var LINK="minecraft://?addExternalServer=Ducksmp|ducksmp.com.br:25544",opened=false,timer;
function marcar(){opened=true;clearTimeout(timer)}
window.addEventListener("blur",marcar);
document.addEventListener("visibilitychange",function(){if(document.hidden)marcar()});
function tentar(){
opened=false;
document.getElementById("fail").style.display="none";
document.getElementById("status").style.display="block";
window.location.href=LINK;
timer=setTimeout(function(){
if(!opened){
document.getElementById("status").style.display="none";
document.getElementById("fail").style.display="flex";
}else{
document.getElementById("status").textContent="Servidor adicionado!";
}
},2500);
}
tentar();
</script>
</body>
</html>
